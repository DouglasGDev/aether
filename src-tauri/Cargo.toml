[package]
name = "aether"
version = "0.1.0"
description = "Aether Core - local-first multi-agent system"
edition = "2024"
rust-version = "1.88"
# `src/bin/engine_probe.rs` é uma ferramenta de medição à parte; sem isto
# `cargo run` (e portanto `tauri dev`) não sabe qual dos dois executar.
default-run = "aether"

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rmcp = { version = "3.10", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest", "transport-streamable-http-server"] }
tokio = { version = "1.53.3", features = ["full"] }
# O servidor MCP que o próprio aplicativo publica fala Streamable HTTP na placa
# de retorno. `hyper` é quem aceita a conexão TCP e fala HTTP/1.1; o serviço do
# rmcp chega como um `tower_service::Service`, que é o traço que o hyper serve.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
http-body-util = "0.1"
bytes = "1"
# O cancelador do laço de aceitação: fechar o servidor é mandar o laço sair e
# esperar a tarefa, não abandonar a porta aberta com um token solto por aí.
tokio-util = "0.7"
# O token do servidor é aleatório de verdade, e vem do gerador do sistema: um
# endpoint que escreve arquivos na máquina não pode ser adivinhado por vizinho.
getrandom = "0.4"
anyhow = "1.0.104"
http = "1.5.0"
candle = { package = "candle-core", version = "0.11.1" }
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = "0.23"
minijinja = { version = "3.1", features = ["serde", "preserve_order"] }
minijinja-contrib = { version = "3.1", features = ["pycompat"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
encoding_rs = "0.8"
cpal = "0.18.2"
ringbuf = "0.6.0"
libloading = "0.9.1"
# O instalador de runtime confere cada DLL contra o SHA256SUMS.txt versionado
# antes de pô-la no lugar: sem isto o aplicativo carregaria binário não conferido.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

[[bin]]
name = "aether"
path = "src/main.rs"

[[bin]]
name = "engine-probe"
path = "src/bin/engine_probe.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# `tauri dev` compila em debug, e debug alcança o motor de inferência: medido no
# Granite 4.2 3B, o perfil de debug não emitia um único token em 10 minutos contra
# 11,3 tokens/s do mesmo build otimizado. Dependências vão a opt-level 3; o crate
# do app continua em debug, que é o que recompila rápido.
[profile.dev.package."*"]
opt-level = 3
